services:

  db:
    image: postgres:16-alpine
    container_name: curriculumlattes-db
    environment:
      POSTGRES_DB: lattes
      POSTGRES_USER: ${POSTGRES_USER:-lattes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lattes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lattes} -d lattes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./back_end
      dockerfile: Dockerfile.dev
    container_name: curriculumlattes-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lattes
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lattes}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lattes}
      JWT_DURATION: ${JWT_DURATION:-86400}
      JWT_SECRET: ${JWT_SECRET:-MinhaChaveSecretaMuitoLongaParaHS512ComPeloMenos64Caracteres1234567}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Cache do repositório Maven entre restarts (dependências não são baixadas de novo).
      - maven_repo:/root/.m2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    develop:
      watch:
        # Ao salvar qualquer arquivo em src/, sincroniza no container e reinicia o app
        # (Maven recompila de forma incremental usando o target já em cache).
        - action: sync+restart
          path: ./back_end/src
          target: /app/src
        # Mudou dependência no pom.xml? Reconstrói a imagem.
        - action: rebuild
          path: ./back_end/pom.xml

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile.dev
    container_name: curriculumlattes-frontend
    ports:
      - "3000:3000"
    environment:
      # Polling é necessário para o watcher enxergar mudanças em bind mounts no Windows.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        # HMR: sincroniza src/ e public/ no container; o dev server aplica no navegador
        # sem recarregar a página.
        - action: sync
          path: ./front_end/src
          target: /app/src
        - action: sync
          path: ./front_end/public
          target: /app/public
        # Mudou dependência? Reconstrói a imagem.
        - action: rebuild
          path: ./front_end/package.json

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: curriculumlattes-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: curriculumlattes_postgres_data
  maven_repo:
    name: curriculumlattes_maven_repo
