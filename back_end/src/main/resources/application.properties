# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lattes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lattes}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lattes}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=false

# Logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.br.ifmg.produto1_2026.service=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.file.name=logs/app.log

# Mail
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}
jwt.secret=${JWT_SECRET:MinhaChaveSecretaMuitoLongaParaHS512ComPeloMenos64Caracteres1234567}
jwt.expiration=86400000
security.jwt.duration=${JWT_DURATION:86400}

# CORS
cors.origins=${CORS_ORIGINS:http://localhost:3000}

# API Docs
springdoc.api-doc.path=/api-docs
